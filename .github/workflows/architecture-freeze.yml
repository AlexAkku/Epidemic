name: Architecture freeze

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-boundaries:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Toolchain identity
        shell: pwsh
        run: |
          python --version
          cmake --version
      - name: Architecture adversarial fixtures
        shell: pwsh
        run: cmake -P cmake/ArchitectureFreezeSelfTest.cmake
  layer-matrix:
    needs: architecture-boundaries
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base-debug
            runtime: OFF
            framework: OFF
            configuration: Debug
          - profile: base-release
            runtime: OFF
            framework: OFF
            configuration: Release
          - profile: runtime-debug
            runtime: ON
            framework: OFF
            configuration: Debug
          - profile: runtime-release
            runtime: ON
            framework: OFF
            configuration: Release
          - profile: full-debug
            runtime: ON
            framework: ON
            configuration: Debug
          - profile: full-release
            runtime: ON
            framework: ON
            configuration: Release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/${{ matrix.profile }}
          -G "Visual Studio 18 2026" -A x64
          -DBUILD_TESTING=ON
          -DEPIDEMIC_BUILD_RUNTIME=${{ matrix.runtime }}
          -DEPIDEMIC_BUILD_FRAMEWORK=${{ matrix.framework }}
          -DEPIDEMIC_WARNINGS_AS_ERRORS=ON
          -DEPIDEMIC_ARCHITECTURE_FREEZE_CHECKS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/${{ matrix.profile }} --config ${{ matrix.configuration }} --parallel
      - name: Per-target public header consumers
        shell: pwsh
        run: cmake --build build/${{ matrix.profile }} --config ${{ matrix.configuration }} --target EpidemicPublicHeaderSelfContainment --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/${{ matrix.profile }} -C ${{ matrix.configuration }} --output-on-failure --timeout 300

  clang-public-surface:
    needs: architecture-boundaries
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure ClangCL full profile
        shell: pwsh
        run: >
          cmake -S . -B build/clang-full
          -G "Visual Studio 18 2026" -A x64 -T ClangCL
          -DBUILD_TESTING=OFF
          -DEPIDEMIC_BUILD_RUNTIME=ON
          -DEPIDEMIC_BUILD_FRAMEWORK=ON
          -DEPIDEMIC_WARNINGS_AS_ERRORS=ON
          -DEPIDEMIC_ARCHITECTURE_FREEZE_CHECKS=ON
      - name: ClangCL public header consumers
        shell: pwsh
        run: cmake --build build/clang-full --config Debug --target EpidemicPublicHeaderSelfContainment --parallel

  auditor-regression:
    needs: architecture-boundaries
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EP_AUDITOR_NATIVE_CONFIG: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Auditor dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ai/tmp | Out-Null
          python -m venv .ai/venv/auditor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .ai/venv/auditor/Scripts/python.exe -m pip install --disable-pip-version-check -r .epidemic-auditor/requirements.txt
          exit $LASTEXITCODE
      - name: Configure native Auditor
        shell: pwsh
        run: >
          cmake -S .epidemic-auditor/native -B build/auditor-native
          -G "Visual Studio 18 2026" -A x64
          -DPython3_EXECUTABLE="${{ github.workspace }}/.ai/venv/auditor/Scripts/python.exe"
      - name: Build native Auditor and runtime bundle
        shell: pwsh
        run: |
          & Development/AgentsRules/Scripts/Run-Quiet.ps1 -Name auditor-native-${{ matrix.configuration }} -TimeoutSec 900 -Command 'cmake --build build/auditor-native --config ${{ matrix.configuration }} --target EpidemicAuditor --parallel 2'
          exit $LASTEXITCODE
      - name: Auditor backend, evidence and GUI regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/.epidemic-auditor;$PWD/.epidemic-auditor/tests"
          $env:TEMP = "$PWD/.ai/tmp"
          $env:TMP = $env:TEMP
          # Bounded CI regressions; privileged WPR/Verifier and whole-Game
          # acceptance remain separate physical qualification, never CI PASS.
          $tests = @(
            'test_core', 'test_evidence_lineage', 'test_etw_import',
            'test_gui_operations.GuiOperationTests.test_gui_poll_timer_and_callback_errors_are_owned_until_destroy',
            'test_ms67_ms69.ViewTests.test_bounded_pages_nested_continuation_and_scope_binding',
            'test_ms67_ms69.ViewTests.test_unknown_not_zero_or_pass_and_incompatible_comparison',
            'test_ms67_ms69.ViewTests.test_history_routes_and_unknown_are_bounded_without_invented_measurements',
            'test_ms67_ms69.ViewTests.test_raw_tampering_is_not_an_empty_successful_view',
            'test_ms67_ms69.ViewTests.test_real_process_nonzero_exit_findings_exports_and_cli',
            'test_etw_broker.EtwBrokerTests.test_dumper_capacity_matches_streamed_raw_bound_and_rejects_overflow'
          )
          $command = '.ai/venv/auditor/Scripts/python.exe -B -m unittest -v ' + ($tests -join ' ')
          & Development/AgentsRules/Scripts/Run-Quiet.ps1 -Name auditor-regression-${{ matrix.configuration }} -TimeoutSec 600 -Command $command
          exit $LASTEXITCODE
