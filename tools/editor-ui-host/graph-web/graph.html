<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-%HASH%'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><style>%STYLE%</style></head><body>
<nav aria-label="Graph commands">
<button data-action="fit">Fit</button><button data-action="reset">Reset View</button>
<button data-command="compile">Compile</button><button data-command="run">Run Preview</button>
<button data-command="save">Save</button><button data-command="undo">Undo</button><button data-command="redo">Redo</button>
<button data-command="duplicate">Duplicate</button><button data-command="delete">Delete</button><button data-command="group">Group</button>
<button data-action="bookmark">Next Bookmark</button><button data-command="uses">Find Uses</button>
<span id="selection" aria-live="polite"></span></nav>
<div id="graph-surface"><main id="graph" aria-label="Graph Canvas" tabindex="0"></main><div id="problem" role="alert" hidden></div></div>
<canvas id="minimap" width="168" height="100" aria-label="Graph minimap; click to navigate"></canvas>
<div id="context" role="menu" hidden></div><footer id="status" aria-live="polite">Loading native Graph…</footer>
<script>%SCRIPT%</script></body></html>
